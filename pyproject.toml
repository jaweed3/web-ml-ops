[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuevision-mlops"
version = "2.0.0"
description = "End-to-end MLOps pipeline for RescueVision SAR victim detection"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "mlflow>=2.10.0",
    "dagshub>=0.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "dvc[s3]>=3.0.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "rich>=15.0.0",
    "onnxslim>=0.1.91",
    "slowapi>=0.1.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Default: CPU (Mac / CI / dev). Training machine: run `make install-train-cuda` instead.
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# ── Dependencies ───────────────────────────────────────────────

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]

train = [
    "ultralytics>=8.0.0",
    "onnxruntime-tools>=1.7.0",
    "onnxruntime-extensions>=0.9.0",
    "tensorflow>=2.15.0"
]

debug = [
    "torch", # Need CPU version for development, debug and logic testing only
    "torchvision",
    "torchaudio",
    "matplotlib>=3.8.0",
    "ipykernel>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # do not perform function call in default arguments (FastAPI pattern)
    "N803",  # argument name should be lowercase (some ML conventions use uppercase)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # allow assert in tests
"research/*" = ["E402", "F401", "E501"]  # notebooks have non-top imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy (type checking) ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = ["research/", ".venv/"]

# Enforce these even in non-strict mode
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["pipeline", "core", "app"]
omit = [
    "*/__pycache__/*",
    "*/research/*",
    ".venv/*",
    "app/utils/dummy_dataset.py",
    "app/utils/dummy_yaml.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.setuptools.packages.find]
include = ["app*", "core*", "pipeline*"]
exclude = ["research*", "artifacts*", "monitoring", "configs*", "tests*"]
