data:
  # Root directory that contains train_data/ and test_data/ subdirectories.
  # '.' means the project root (web-ml-ops/) when running via make or uv run.
  dir: .
  yaml: dataset.yaml
  subset_dir: data/coco_person_subset
  subset_yaml: data/coco_person_subset/dataset.yaml

model:
  name: yolov8n.pt

train:
  epochs: 50
  imgsz: 640
  batch: 16
  lr0: 0.01
  optimizer: AdamW
  # Device options:
  #   cuda  → RTX 4060 lab (auto-detected if only one GPU)
  #   mps   → Mac Mini M4 (Apple Silicon)
  #   cpu   → fallback (slow, not recommended for full training)
  #   0     → first CUDA device (same as cuda)
  # Override with env var: TRAIN_DEVICE=mps make subset
  device: cuda

debug:
  epochs: 1
  imgsz: 320
  batch: 4
  device: cpu
  max_samples: 50

