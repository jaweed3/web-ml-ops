services:

  # ── Inference server ─────────────────────────────────────────────────────────
  rescuevision-serve:
    build: .
    ports:
      - "8080:8080"
    environment:
      DAGSHUB_USERNAME: ${DAGSHUB_USERNAME}
      DAGSHUB_REPO: ${DAGSHUB_REPO}
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN}
      MODEL_NAME: ${MODEL_NAME:-rescuevision-onnx-int8}
      MODEL_VERSION: ${MODEL_VERSION:-latest}
      MODEL_FORMAT: ${MODEL_FORMAT:-onnx_int8}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.25}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.45}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    volumes:
      - model_cache:/tmp/rescuevision_model

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped
    depends_on:
      - rescuevision-serve

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-rescuevision}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rescuevision.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  model_cache:
  prometheus_data:
  grafana_data:
