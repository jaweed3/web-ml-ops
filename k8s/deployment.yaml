apiVersion: apps/v1
kind: Deployment
metadata:
  name: rescuevision-api
  labels:
    app: rescuevision-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rescuevision-api
  template:
    metadata:
      labels:
        app: rescuevision-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: rescuevision-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: rescuevision-secrets
                  key: api-key
            - name: DAGSHUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rescuevision-secrets
                  key: dagshub-username
            - name: DAGSHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rescuevision-secrets
                  key: dagshub-token
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
