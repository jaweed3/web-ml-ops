stages:
  data:
    cmd: python pipeline/stage1_data.py
    deps:
      - pipeline/stage1_data.py
    outs:
      - train_data
      - test_data
      - artifacts/dataset_hash.txt

  train:
    cmd: python pipeline/stage2_train.py
    deps:
      - pipeline/stage2_train.py
      - train_data
      - test_data
      - configs/train_config.yaml
    params:
      - params.yaml:
        - train.epochs
        - train.imgsz
        - train.batch
    outs:
      - runs/train/weights/best.pt

  export:
    cmd: python pipeline/stage3_export.py
    deps:
      - pipeline/stage3_export.py
      - runs/train/weights/best.pt
    outs:
      - artifacts/model.onnx
      - artifacts/model_int8.onnx

  benchmark:
    cmd: python pipeline/stage4_benchmark.py
    deps:
      - pipeline/stage4_benchmark.py
      - artifacts/model.onnx
      - artifacts/model_int8.onnx
      - train_data/images/val
    outs:
      - artifacts/benchmark_report.json

  register:
    cmd: python pipeline/stage5_register.py
    deps:
      - pipeline/stage5_register.py
      - artifacts/benchmark_report.json
      - artifacts/dataset_hash.txt
