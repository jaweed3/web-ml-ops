name: RescueVision MLOps Pipeline

on:
  push:
    branches: ["**"]          # lint + test on every branch
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: "Promote latest Staging model → Production"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  PYTHON_VERSION: "3.12"

# ── Job 1: Lint + type-check (all branches) ──────────────────────────────────
jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install quality tools
        run: uv pip install ruff mypy pydantic fastapi

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy app/ core/ pipeline/ --ignore-missing-imports
        continue-on-error: true   # warn only until strict typing is complete

# ── Job 2: Test suite (all branches) ─────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run serve unit tests
        run: uv run pytest tests/serve/ tests/test_metric_gate.py -v --cov=app --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

# ── Job 3: Full pipeline → Staging (main branch only) ─────────────────────────
  pipeline-staging:
    name: Pipeline → Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    environment: staging
    env:
      USE_SUBSET: "true"
      TRAIN_DEVICE: cpu
      DEBUG_MODE: "true"
      DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install base dependencies
        run: uv sync

      - name: Install training dependencies (ultralytics + tensorflow)
        run: uv pip install -r requirements-train.txt

      - name: Configure DVC remote credentials
        run: |
          uv run dvc remote modify storage --local access_key_id ${{ secrets.DAGSHUB_TOKEN }}
          uv run dvc remote modify storage --local secret_access_key ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull subset dataset (DVC)
        run: uv run dvc pull --force data/coco_person_subset.dvc test_data.dvc

      - name: Stage 1 — Data
        run: uv run python -m pipeline.stage1_data

      - name: Stage 2 — Train (subset, CPU)
        run: uv run python -m pipeline.stage2_train

      - name: Stage 3 — Export
        run: uv run python -m pipeline.stage3_export

      - name: Stage 4 — Benchmark
        run: uv run python -m pipeline.stage4_benchmark

      - name: Stage 5 — Register to Staging
        run: uv run python -m pipeline.stage5_register --stage Staging

      - name: Upload edge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edge-artifacts-${{ github.sha }}
          path: artifacts/
          retention-days: 30

# ── Job 4: Promote Staging → Production ───────────────────────────────────────
  promote-production:
    name: Promote Staging → Production
    runs-on: ubuntu-latest
    needs: pipeline-staging
    if: |
      always() &&
      needs.pipeline-staging.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.promote_to_production == 'true')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv pip install mlflow dagshub httpx

      - name: Promote models Staging → Production (with regression guard)
        run: uv run python -m pipeline.stage_promote
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
